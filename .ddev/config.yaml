type: drupal11
docroot: web
php_version: "8.5"
xdebug_enabled: false
database:
    type: mariadb
    version: "11.8"
fail_on_hook_fail: true
hooks:
    post-share:
        - exec-host: echo "post-share happened"
    post-start:
        - composer: install
    pre-share:
        - exec-host: 'echo "pre-share: $DDEV_SHARE_URL"'
dbimage_extra_packages: [sudo]
use_dns_when_possible: true
  #ngrok_args: --url https://nonportentously-caulicolous-cedrick.ngrok-free.dev
composer_version: "2"
web_environment:
    - PLATFORM_PROJECT=ct5b4hzofqk52
    - PLATFORM_ENVIRONMENT=main
corepack_enable: true
